<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro NES Web Emulator</title>
    <!-- Include Tailwind CSS for a clean, non-AI layout structure -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include JSNES Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsnes/1.1.0/jsnes.min.js"></script>
    <style>
        /* Custom pixelated rendering and retro-modern styling */
        body {
            background-color: #0f1115;
            color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #000;
        }
        /* Custom scrollbar & styling enhancements */
        .glass-panel {
            background: rgba(24, 28, 36, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .retro-button {
            transition: all 0.15s ease;
        }
        .retro-button:active {
            transform: scale(0.96);
        }
        /* Fullscreen handling */
        #emulator-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 0;
            margin: 0;
            border: none;
        }
        #emulator-wrapper:fullscreen canvas {
            width: auto;
            height: 100vh;
            max-width: 100vw;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6">

    <!-- Header Navigation -->
    <header class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 py-3 px-4 glass-panel rounded-xl shadow-lg mb-4">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" id="status-indicator"></div>
            <h1 class="text-lg font-semibold tracking-wide text-white">RETRO<span class="text-indigo-400 font-bold">NES</span></h1>
        </div>

        <div class="flex items-center flex-wrap gap-2 justify-center">
            <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow transition retro-button">
                <span>Upload ROM</span>
                <input type="file" id="rom-upload" accept=".nes" class="hidden">
            </label>
            <button id="audio-toggle" class="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow transition retro-button">
                Audio: Off
            </button>
            <button id="gamepad-status-btn" class="bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700 cursor-default">
                Gamepad: Disconnected
            </button>
            <button id="fullscreen-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow transition retro-button">
                Fullscreen
            </button>
        </div>
    </header>

    <!-- Main Display Area -->
    <main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center flex-grow">
        <div id="emulator-wrapper" class="relative rounded-lg overflow-hidden shadow-2xl border border-slate-800 bg-black flex items-center justify-center max-w-full">
            <canvas id="nes-canvas" width="256" height="240" class="w-full max-w-[640px] aspect-[4/3] h-auto object-contain"></canvas>
            
            <!-- Drag and Drop Overlay / Welcome Screen -->
            <div id="drop-overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300">
                <svg class="w-12 h-12 text-indigo-400 mb-3 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <h3 class="text-white font-medium text-base mb-1">Drag & Drop your .nes ROM here</h3>
                <p class="text-slate-400 text-xs mb-4">Or click the "Upload ROM" button above to start playing.</p>
                <div class="text-[10px] text-slate-500 uppercase tracking-widest font-mono">Compatible with standard NES cartridges</div>
            </div>
        </div>

        <!-- Desktop Controls Reference -->
        <div class="hidden md:flex items-center gap-6 mt-3 text-xs text-slate-400 glass-panel px-4 py-2 rounded-lg">
            <div><strong class="text-slate-300">D-Pad:</strong> Arrow Keys</div>
            <div><strong class="text-slate-300">Jump (A):</strong> Space / X</div>
            <div><strong class="text-slate-300">Run (B):</strong> Z</div>
            <div><strong class="text-slate-300">Start:</strong> Enter</div>
            <div><strong class="text-slate-300">Select:</strong> Shift</div>
        </div>
    </main>

    <!-- Virtual Mobile Controller (Optimized for Multi-touch) -->
    <div id="virtual-controller" class="w-full max-w-xl mx-auto mt-4 glass-panel p-3 rounded-2xl flex justify-between items-center select-none shadow-xl border border-slate-800">
        <!-- D-Pad -->
        <div class="relative w-32 h-32 bg-slate-900/60 rounded-full border border-slate-700/50 flex items-center justify-center shadow-inner">
            <div class="absolute inset-0 grid grid-cols-3 grid-rows-3 p-1">
                <div></div>
                <button data-key="up" class="virtual-btn bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 rounded-t-md flex items-center justify-center text-slate-300 shadow">▲</button>
                <div></div>
                <button data-key="left" class="virtual-btn bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 rounded-l-md flex items-center justify-center text-slate-300 shadow">◀</button>
                <div class="bg-slate-800/50"></div>
                <button data-key="right" class="virtual-btn bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 rounded-r-md flex items-center justify-center text-slate-300 shadow">▶</button>
                <div></div>
                <button data-key="down" class="virtual-btn bg-slate-800 hover:bg-slate-700 active:bg-indigo-600 rounded-b-md flex items-center justify-center text-slate-300 shadow">▼</button>
                <div></div>
            </div>
        </div>

        <!-- Center System Buttons (Select / Start) -->
        <div class="flex flex-col gap-3 items-center">
            <div class="flex gap-2">
                <div class="flex flex-col items-center">
                    <button data-key="select" class="virtual-btn w-10 h-4 bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 rounded-full shadow border border-slate-600"></button>
                    <span class="text-[9px] text-slate-400 uppercase mt-1 tracking-wider">Select</span>
                </div>
                <div class="flex flex-col items-center">
                    <button data-key="start" class="virtual-btn w-10 h-4 bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 rounded-full shadow border border-slate-600"></button>
                    <span class="text-[9px] text-slate-400 uppercase mt-1 tracking-wider">Start</span>
                </div>
            </div>
        </div>

        <!-- Action Buttons (A / B) -->
        <div class="flex gap-3 items-center">
            <div class="flex flex-col items-center">
                <button data-key="b" class="virtual-btn w-12 h-12 bg-rose-900/80 hover:bg-rose-800 active:bg-rose-600 rounded-full border border-rose-700 text-white font-bold text-sm shadow-lg flex items-center justify-center">B</button>
            </div>
            <div class="flex flex-col items-center pb-6">
                <button data-key="a" class="virtual-btn w-12 h-12 bg-rose-600 hover:bg-rose-500 active:bg-rose-400 rounded-full border border-rose-400 text-white font-bold text-sm shadow-lg flex items-center justify-center">A</button>
            </div>
        </div>
    </div>

    <!-- Footer / Watermark -->
    <footer class="w-full text-center mt-4 text-xs text-slate-500 tracking-wider font-medium">
        Made By WeBox Community Owner
    </footer>

    <script>
        const canvas = document.getElementById('nes-canvas');
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(256, 240);

        let audioCtx = null;
        let audioBuffers = [];
        let isAudioEnabled = false;
        let isRunning = false;

        // Initialize JSNES instance
        const nes = new jsnes.NES({
            onFrame: function(frameBuffer) {
                for (let i = 0; i < frameBuffer.length; i++) {
                    let pixel = frameBuffer[i];
                    imageData.data[i * 4] = (pixel >> 16) & 0xFF;     // Red
                    imageData.data[i * 4 + 1] = (pixel >> 8) & 0xFF;  // Green
                    imageData.data[i * 4 + 2] = pixel & 0xFF;         // Blue
                    imageData.data[i * 4 + 3] = 255;                  // Alpha
                }
                ctx.putImageData(imageData, 0, 0);
            },
            onAudioSample: function(left, right) {
                if (!isAudioEnabled || !audioCtx) return;
                audioBuffers.push((left + right) / 2);
                if (audioBuffers.length > 4096) {
                    flushAudioBuffer();
                }
            }
        });

        function flushAudioBuffer() {
            if (!audioCtx || audioBuffers.length === 0) return;
            try {
                const buffer = audioCtx.createBuffer(1, audioBuffers.length, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < audioBuffers.length; i++) {
                    data[i] = audioBuffers[i];
                }
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(audioCtx.destination);
                source.start();
            } catch(e) {
                // Ignore queue overlaps
            }
            audioBuffers = [];
        }

        // Audio Toggle Button
        const audioToggleBtn = document.getElementById('audio-toggle');
        audioToggleBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioEnabled = !isAudioEnabled;
            audioToggleBtn.textContent = isAudioEnabled ? 'Audio: On' : 'Audio: Off';
            audioToggleBtn.className = isAudioEnabled 
                ? 'bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow transition retro-button' 
                : 'bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium shadow transition retro-button';
        });

        // ROM Loading Helper
        function loadRomData(binaryString, romName) {
            try {
                nes.loadROM(binaryString);
                document.getElementById('drop-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('drop-overlay').style.display = 'none';
                }, 300);
                document.getElementById('status-indicator').classList.remove('bg-emerald-500');
                document.getElementById('status-indicator').classList.add('bg-indigo-500');
                
                if (!isRunning) {
                    isRunning = true;
                    requestAnimationFrame(runEmulatorLoop);
                }
            } catch (err) {
                alert('Failed to load ROM: ' + err.message);
            }
        }

        function runEmulatorLoop() {
            nes.frame();
            requestAnimationFrame(runEmulatorLoop);
        }

        // File Upload Handler
        document.getElementById('rom-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                loadRomData(event.target.result, file.name);
            };
            reader.readAsBinaryString(file);
        });

        // Drag and Drop ROM support
        const dropOverlay = document.getElementById('drop-overlay');
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.nes')) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    loadRomData(event.target.result, file.name);
                };
                reader.readAsBinaryString(file);
            }
        });

        // Fullscreen Toggle
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            const wrapper = document.getElementById('emulator-wrapper');
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        });

        // Controller Mapping Constants
        const KEY_MAP = {
            'ArrowUp': jsnes.Controller.BUTTON_UP,
            'ArrowDown': jsnes.Controller.BUTTON_DOWN,
            'ArrowLeft': jsnes.Controller.BUTTON_LEFT,
            'ArrowRight': jsnes.Controller.BUTTON_RIGHT,
            'KeyX': jsnes.Controller.BUTTON_A,
            'Space': jsnes.Controller.BUTTON_A,
            'KeyZ': jsnes.Controller.BUTTON_B,
            'Enter': jsnes.Controller.BUTTON_START,
            'ShiftLeft': jsnes.Controller.BUTTON_SELECT,
            'ShiftRight': jsnes.Controller.BUTTON_SELECT
        };

        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            let code = e.code;
            if (e.key === ' ') code = 'Space';
            if (KEY_MAP[code] !== undefined) {
                nes.buttonDown(1, KEY_MAP[code]);
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
                    e.preventDefault(); // Stop page scrolling
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            let code = e.code;
            if (e.key === ' ') code = 'Space';
            if (KEY_MAP[code] !== undefined) {
                nes.buttonUp(1, KEY_MAP[code]);
            }
        });

        // Virtual Touch Controller bindings (Multi-touch enabled)
        const virtualButtons = {
            'up': jsnes.Controller.BUTTON_UP,
            'down': jsnes.Controller.BUTTON_DOWN,
            'left': jsnes.Controller.BUTTON_LEFT,
            'right': jsnes.Controller.BUTTON_RIGHT,
            'a': jsnes.Controller.BUTTON_A,
            'b': jsnes.Controller.BUTTON_B,
            'start': jsnes.Controller.BUTTON_START,
            'select': jsnes.Controller.BUTTON_SELECT
        };

        document.querySelectorAll('.virtual-btn').forEach(btn => {
            const keyName = btn.getAttribute('data-key');
            const buttonId = virtualButtons[keyName];

            ['touchstart', 'mousedown'].forEach(evt => {
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    nes.buttonDown(1, buttonId);
                });
            });

            ['touchend', 'mouseup', 'mouseleave'].forEach(evt => {
                btn.addEventListener(evt, (e) => {
                    e.preventDefault();
                    nes.buttonUp(1, buttonId);
                });
            });
        });

        // HTML5 Gamepad API Support (Automatic polling for physical gamepads)
        let connectedGamepadIndex = null;
        const gamepadStatusBtn = document.getElementById('gamepad-status-btn');

        window.addEventListener('gamepadconnected', (e) => {
            connectedGamepadIndex = e.gamepad.index;
            gamepadStatusBtn.textContent = `Gamepad: Connected`;
            gamepadStatusBtn.className = 'bg-emerald-900/60 text-emerald-300 px-3 py-1.5 rounded-lg text-xs font-medium border border-emerald-700/50';
        });

        window.addEventListener('gamepaddisconnected', (e) => {
            if (connectedGamepadIndex === e.gamepad.index) {
                connectedGamepadIndex = null;
                gamepadStatusBtn.textContent = `Gamepad: Disconnected`;
                gamepadStatusBtn.className = 'bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-700';
            }
        });

        // Poll Gamepad State every animation frame
        function pollGamepads() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (connectedGamepadIndex !== null && gamepads[connectedGamepadIndex]) {
                const gp = gamepads[connectedGamepadIndex];
                
                // Map standard gamepad buttons to NES controller
                // Standard mapping: 0=A, 1=B, 8=Select, 9=Start, 12=D-pad Up, 13=Down, 14=Left, 15=Right
                const updateButtonState = (buttonIndex, nesButton) => {
                    if (gp.buttons[buttonIndex] && gp.buttons[buttonIndex].pressed) {
                        nes.buttonDown(1, nesButton);
                    } else {
                        nes.buttonUp(1, nesButton);
                    }
                };

                updateButtonState(0, jsnes.Controller.BUTTON_A);      // A button
                updateButtonState(1, jsnes.Controller.BUTTON_B);      // B button
                updateButtonState(8, jsnes.Controller.BUTTON_SELECT); // Select
                updateButtonState(9, jsnes.Controller.BUTTON_START);  // Start

                // D-Pad buttons or Left Stick axes
                const dpadUp = gp.buttons[12] && gp.buttons[12].pressed || gp.axes[1] < -0.5;
                const dpadDown = gp.buttons[13] && gp.buttons[13].pressed || gp.axes[1] > 0.5;
                const dpadLeft = gp.buttons[14] && gp.buttons[14].pressed || gp.axes[0] < -0.5;
                const dpadRight = gp.buttons[15] && gp.buttons[15].pressed || gp.axes[0] > 0.5;

                if (dpadUp) nes.buttonDown(1, jsnes.Controller.BUTTON_UP); else nes.buttonUp(1, jsnes.Controller.BUTTON_UP);
                if (dpadDown) nes.buttonDown(1, jsnes.Controller.BUTTON_DOWN); else nes.buttonUp(1, jsnes.Controller.BUTTON_DOWN);
                if (dpadLeft) nes.buttonDown(1, jsnes.Controller.BUTTON_LEFT); else nes.buttonUp(1, jsnes.Controller.BUTTON_LEFT);
                if (dpadRight) nes.buttonDown(1, jsnes.Controller.BUTTON_RIGHT); else nes.buttonUp(1, jsnes.Controller.BUTTON_RIGHT);
            }
            requestAnimationFrame(pollGamepads);
        }
        requestAnimationFrame(pollGamepads);
    </script>
</body>
</html>
